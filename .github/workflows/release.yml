# نشر تطبيق الجوال من GitHub بدل جهاز المطوّر: Actions ← Release ← Run workflow.
# يشغّل tool/publish_release.dart نفسه الذي تشغّله القائمة المحلية (tool/release.dart)،
# فالطريقتان تنشران الشيء نفسه وتبقى المحلية احتياطاً.
#
# test: بناء تجريبي من الفرع المختار (Use workflow from)، APK واحد يُرفع في صفحة
# التشغيل (Artifacts) وحدها: لا نشر لأي مدرسة، ولا Play، ولا رقم إصدار جديد.
# يُثبَّت على جوال التجربة (مدرسة النخبة) ثم يُحذف تلقائياً بعد 7 أيام.
# build وpatch وadd-schools من main وحده: بناء من فرع تجريبي لا يصل المدارس بالخطأ.
#
# الأسرار (Settings ← Secrets and variables ← Actions):
#   ANDROID_KEYSTORE_BASE64   ملف center-release.jks بصيغة base64
#   ANDROID_KEY_PROPERTIES    محتوى android/key.properties كما هو
#   SHOREBIRD_TOKEN           مفتاح API من console.shorebird.dev
#   DEV_USERNAME/DEV_PASSWORD حساب المطوّر - لقائمة المدارس
#   RELEASES_TOKEN            توكن يكتب على center-mobile-releases
#   PLAY_UPLOAD_KEYSTORE_BASE64 / PLAY_UPLOAD_KEY_PROPERTIES
#                             مفتاح رفع المتجر: التحديث الصامت يُرسل لنسخة Google Play أيضاً
name: Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options:
          - build        # New build for all schools
          - patch        # Silent update (Dart code only)
          - add-schools  # Copies for every school that has none yet
          - test         # One trial APK in Artifacts only - no school, no Play
        default: build
      notes:
        description: What changed (users see this) - needed for build and patch
        type: string
        required: false
      optional:
        description: Let users skip this build (build only)
        type: boolean
        default: true

# نشران معاً يتسابقان على رقم الإصدار نفسه. التجريبي لا ينشر فلا ينتظرهما
concurrency:
  group: ${{ inputs.action == 'test' && format('release-test-{0}', github.ref) || 'release' }}
  cancel-in-progress: false

permissions:
  contents: write # رفع كوميت رقم الإصدار بعد البناء

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Publish from main only
        if: inputs.action != 'test' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::${{ inputs.action }} publishes to schools: run it from main (this run is on ${{ github.ref_name }}). Trial builds: action test"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # نفس إصدار Flutter المحلي: سكربت النشر يُلزم Shorebird به
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - uses: shorebirdtech/setup-shorebird@v1
        if: inputs.action != 'test'
        with:
          cache: true

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_PROPERTIES secrets are missing"
            exit 1
          fi
          # الأسرار المرفوعة من ويندوز تحمل \r: تُفسد فكّ base64 وتلتصق بكلمات السر
          printf '%s' "$KEYSTORE" | tr -d '\r\n ' | base64 --decode > android/center-release.jks
          # storeFile نسبةً إلى مجلد android: الملف كُتب بجانبه
          printf '%s\n' "$KEY_PROPERTIES" | tr -d '\r' | sed 's/^storeFile=.*/storeFile=center-release.jks/' > android/key.properties

      - run: flutter pub get

      # اعتماد أُضيف لـ pubspec دون قفله: يُقفل هنا بإصدار Flutter نفسه، ويُرفع مع كوميت الإصدار
      - name: Commit pubspec.lock
        if: inputs.action != 'test'
        run: |
          if ! git diff --quiet -- pubspec.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "pubspec.lock" -- pubspec.lock
          fi

      # بناء تجريبي: الحزمة العامة كما يبنيها فحص main، بلا Shorebird ولا رفع لأحد
      - name: Trial build
        if: inputs.action == 'test'
        run: flutter build apk --release --target-platform android-arm64

      - name: Trial APK
        if: inputs.action == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: noon-test-${{ github.run_number }}-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Publish
        if: inputs.action != 'test'
        env:
          ACTION: ${{ inputs.action }}
          NOTES: ${{ inputs.notes }}
          OPTIONAL: ${{ inputs.optional }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          DEV_USERNAME: ${{ secrets.DEV_USERNAME }}
          DEV_PASSWORD: ${{ secrets.DEV_PASSWORD }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          case "$ACTION" in
            build)
              args=(--notes "$NOTES")
              [ "$OPTIONAL" = "true" ] && args+=(--optional)
              ;;
            patch)
              args=(--patch --notes "$NOTES")
              ;;
            add-schools)
              # كل مدرسة نشطة ليست لها نسخة في البناء المنشور
              args=(--add-schools all)
              ;;
          esac
          dart run tool/publish_release.dart "${args[@]}"

      # السكربت يكتب رقم الإصدار الجديد في pubspec ويحفظه كوميتاً محلياً
      - name: Push the version commit
        if: inputs.action == 'build'
        run: git push origin HEAD

  # التحديث الصامت يصل نسخة Google Play أيضاً: إصدارها في Shorebird منفصل ويُبنى بـ STORE=play
  play_patch:
    needs: release
    if: inputs.action == 'patch'
    uses: ./.github/workflows/play-store.yml
    with:
      action: patch
    secrets:
      PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
      PLAY_UPLOAD_KEY_PROPERTIES: ${{ secrets.PLAY_UPLOAD_KEY_PROPERTIES }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
