name: Diag apksigner
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.41.6', channel: stable }
      - run: ls "$ANDROID_HOME/build-tools"; echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
      - run: gh release download v2.2 --repo engmohammedaqlain-ctrl/center-mobile-releases --pattern 'center-2.2.apk' -D /tmp
        env: { GH_TOKEN: '${{ github.token }}' }
      - run: flutter pub get >/dev/null
      - run: |
          mkdir -p tool/diag && cat > tool/diag/d.dart <<'DART'
          import 'dart:io';
          import '../publish_release.dart';
          Future<void> main() async {
            final Directory tools = Directory('${Platform.environment['ANDROID_HOME']}/build-tools');
            print('dirs: ${tools.listSync().map((e) => e.path).toList()}');
            for (final d in tools.listSync().whereType<Directory>()) {
              final exe = '${d.path}/apksigner';
              if (!File(exe).existsSync()) { print('$exe missing'); continue; }
              final r = await Process.run(exe, ['verify', '--print-certs', '/tmp/center-2.2.apk']);
              print('== $exe exit=${r.exitCode}\nOUT:\n${r.stdout}\nERR:\n${r.stderr}\ndigest=${signerDigest('${r.stdout}')}');
            }
          }
          DART
          dart run tool/diag/d.dart
